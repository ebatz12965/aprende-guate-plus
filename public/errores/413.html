<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>El archivo es demasiado grande · Aprende Guate</title>
<link rel="icon" type="image/png" href="/images/aprende-guate-app-icon.png">
<!-- Página estática: la muestra nginx cuando Laravel no puede responder (no depende de PHP ni de la base de datos). -->
<style>
:root{--ground:#F8FAFC;--surface:#FFF;--ink:#0F172A;--text:#334155;--muted:#64748B;--border:#E2E8F0;--blue:#1976D2;--blue-ink:#1565C0;--tint:#E3F2FD}
@media (prefers-color-scheme:dark){:root{--ground:#020617;--surface:#0F172A;--ink:#F8FAFC;--text:#CBD5E1;--muted:#94A3B8;--border:#334155;--blue:#2196F3;--blue-ink:#81D4FA;--tint:rgb(25 118 210 / .2)}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1.5rem;background:var(--ground);color:var(--text);font:400 16px/1.6 Figtree,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:min(34rem,100%)}.brand{display:inline-flex;align-items:center;gap:.75rem;color:var(--ink);text-decoration:none;font-weight:800}.brand img{width:2.5rem;height:2.5rem;border-radius:.75rem}
.card{margin-top:1.75rem;padding:2rem;border:1px solid var(--border);border-radius:1.5rem;background:var(--surface);box-shadow:0 18px 40px -24px rgb(2 6 23 / .35)}
.code{display:inline-block;padding:.25rem .75rem;border-radius:999px;background:var(--tint);color:var(--blue-ink);font-weight:800;font-size:.8rem;letter-spacing:.12em}
h1{margin:1rem 0 0;color:var(--ink);font-size:clamp(1.6rem,4vw,2.1rem);line-height:1.15;font-weight:800}p{margin:.75rem 0 0}.hint{color:var(--muted);font-size:.92rem}
.btn{display:inline-flex;align-items:center;min-height:2.75rem;margin-top:1.75rem;padding:0 1.25rem;border-radius:.75rem;font:700 .9rem/1 inherit;border:1px solid var(--blue);background:var(--blue);color:#fff;cursor:pointer;text-decoration:none}
footer{margin-top:1.25rem;color:var(--muted);font-size:.8rem;text-align:center}
</style>
</head>
<body>
<main>
<a class="brand" href="/"><img src="/images/aprende-guate-app-icon.png" alt="">Aprende Guate</a>
<section class="card"><span class="code">ERROR 413</span><h1>El archivo es demasiado grande</h1><p>Puedes subir archivos de hasta 10 MB. Reduce el tamaño (por ejemplo, guardándolo como PDF) y vuelve a intentarlo.</p><p class="hint">Tus demás datos no se perdieron.</p>
<button type="button" class="btn" onclick="history.back()">Volver</button></section>
<footer>Plataforma educativa de Guatemala</footer>
</main>
</body>
</html>
